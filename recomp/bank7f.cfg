bank = 7F
includes = common_rtl.h smw_rtl.h variables.h funcs.h

# InitM7BossOAM calls the last 28 stores in the existing guarded 7F8000
# OAM-reset snapshot. Decode that real interior entry from the same snapshot;
# no additional captured bytes or unguarded RAM execution are introduced.
# The suffix contains only STA absolute and RTL, so its M/X widths are stable.
func SmwRunDecompressFromWRAM_Entry2 812E entry_mx:1,1 exit_mx:1,1
